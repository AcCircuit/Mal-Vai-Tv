<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibli Mal Tv | Live Premium IPTV</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Premium Header */
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #233554;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .logo-area h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .logo-area span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            text-transform: none;
            letter-spacing: 0;
        }

        /* Live Counter */
        .live-badge {
            background: #ef4444;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
            100% { opacity: 0.8; }
        }

        /* Main App Grid */
        .main-container {
            display: grid;
            grid-template-columns: 2.8fr 1.2fr;
            max-width: 1500px;
            width: 100%;
            margin: 20px auto;
            gap: 20px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Left Side: Video Player */
        .player-wrapper {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #233554;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Right Side: Sidebar */
        .sidebar {
            background-color: var(--bg-card);
            border-radius: 16px;
            border: 1px solid #233554;
            display: flex;
            flex-direction: column;
            max-height: 620px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Controls / Filtering inside Sidebar */
        .search-filter-box {
            padding: 15px;
            background: #0f172a;
            border-bottom: 1px solid #233554;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Category Buttons */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* Channel List Styling */
        .channel-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .channel-grid {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #1e293b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: #24334d;
            border-color: #334155;
            transform: translateY(-1px);
        }

        .channel-card.active {
            background: linear-gradient(90deg, #1e3a8a, #0f172a);
            border-left: 4px solid var(--accent-color);
            border-color: #2563eb;
        }

        .channel-icon {
            width: 35px;
            height: 35px;
            background: #0f172a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 14px;
            border: 1px solid #334155;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .channel-cat {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Responsive Layout */
        @media (max-width: 992px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Sibli Mal Tv</h1>
            <span>Premium Sports & Entertainment Network</span>
        </div>
        <div class="live-badge">
            <span style="width:8px; height:8px; background:white; border-radius:50%; display:inline-block;"></span>
            LIVE 150+ CHANNELS
        </div>
    </header>

    <div class="main-container">
        
        <div class="player-wrapper">
            <video
                id="sibli-player"
                class="video-js vjs-theme-city vjs-16-9 vjs-big-play-centered"
                controls
                preload="auto"
                width="100%"
                data-setup='{}'>
                <p class="vjs-no-js">Please enable JavaScript to view this stream.</p>
            </video>
        </div>

        <div class="sidebar">
            <div class="search-filter-box">
                <input type="text" id="searchBar" class="search-input" placeholder="Search channel name...">
                <div class="category-tabs">
                    <button class="tab-btn active" onclick="filterCategory('all')">All</button>
                    <button class="tab-btn" onclick="filterCategory('Bangla')">Bangla</button>
                    <button class="tab-btn" onclick="filterCategory('Sports')">Sports</button>
                    <button class="tab-btn" onclick="filterCategory('Indian')">Indian</button>
                </div>
            </div>

            <div class="channel-list-container">
                <ul id="channelGrid" class="channel-grid">
                    </ul>
            </div>
        </div>

    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        const player = videojs('sibli-player');
        const channelGrid = document.getElementById('channelGrid');
        const searchBar = document.getElementById('searchBar');
        
        // গিটহাবের একই ডিরেক্টরি থেকে প্লেলিস্ট টানবে
        const m3uUrl = 'playlist.m3u'; 
        let allChannels = [];
        let currentCategory = 'all';

        // M3U ফাইল পার্স করে ক্যাটাগরি ডিটেক্ট করার অ্যাডভান্সড মেকানিজম
        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // গ্রুপ বা ক্যাটাগরি খোঁজা (যেমন group-title="Sports")
                    let group = 'All';
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch) {
                        group = groupMatch[1];
                    } else {
                        // যদি এক্সপ্লিসিটলি গ্রুপ না থাকে, নামের কি-ওয়ার্ড দিয়ে অটো ক্যাটাগরি করবে
                        if (line.toLowerCase().includes('sports') || line.toLowerCase().includes('cricket') || line.toLowerCase().includes('football') || line.toLowerCase().includes('fancode') || line.toLowerCase().includes('willow')) {
                            group = 'Sports';
                        } else if (line.toLowerCase().includes('tv') && !line.toLowerCase().includes('india')) {
                            group = 'Bangla'; // ডিফল্ট অ্যাসাইনমেন্ট লজিক
                        }
                    }

                    // চ্যানেলের নাম এক্সট্রাক্ট করা
                    const nameMatch = line.match(/,(.+)$/);
                    currentChannel.name = nameMatch ? nameMatch[1].trim() : 'Unknown Channel';
                    currentChannel.category = group;

                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {}; 
                }
            }
            return channels;
        }

        // চ্যানেল লিস্ট স্ক্রিনে রেন্ডার করার মাস্টার ফাংশন
        function renderChannels(channelsToRender) {
            channelGrid.innerHTML = '';
            
            if(channelsToRender.length === 0) {
                channelGrid.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">No channels found!</div>';
                return;
            }

            channelsToRender.forEach((channel, index) => {
                const li = document.createElement('li');
                li.className = 'channel-card';
                
                // শর্ট কোড লোগো জেনারেটর (যেমন: Sports -> SP)
                const shortName = channel.name.substring(0, 2).toUpperCase();

                li.innerHTML = `
                    <div class="channel-icon">${shortName}</div>
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-cat">${channel.category}</div>
                    </div>
                `;

                li.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(channel.url);
                });

                channelGrid.appendChild(li);
            });
        }

        function playStream(url) {
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            player.play().catch(e => console.log("Stream play triggered. Ensure link is active & bypassing CORS."));
        }

        // ক্যাটাগরি ফিল্টারিং ফিল্টার
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyFilterAndSearch();
        }

        // সার্চ এবং ফিল্টার কম্বাইন্ড লজিক
        function applyFilterAndSearch() {
            let filtered = allChannels;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(ch => ch.category.toLowerCase() === currentCategory.toLowerCase());
            }

            const searchKey = searchBar.value.toLowerCase();
            if (searchKey) {
                filtered = filtered.filter(ch => ch.name.toLowerCase().includes(searchKey));
            }

            renderChannels(filtered);
        }

        searchBar.addEventListener('input', applyFilterAndSearch);

        // গিটহাব থেকে প্লেলিস্ট লোড ইনিশিয়েটর
        async function initApp() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error();
                const data = await response.text();
                allChannels = parseM3U(data);
                
                renderChannels(allChannels);

                // প্রথম চ্যানেলটি অটো লোড করা
                if(allChannels.length > 0) {
                    playStream(allChannels[0].url);
                    setTimeout(() => {
                        if(channelGrid.firstChild) channelGrid.firstChild.classList.add('active');
                    }, 200);
                }
            } catch (error) {
                channelGrid.innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">Failed to dynamic load 150+ channels. Make sure playlist.m3u is present in the repository root.</div>';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
