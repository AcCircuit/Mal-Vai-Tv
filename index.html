<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sibli Mal Tv</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b35, #f7b42c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .header p { color: #8e9aaf; font-size: 0.9rem; }
        .player-wrapper {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-js { width: 100%; height: auto; aspect-ratio: 16 / 9; background-color: #000; }
        .channels-section {
            background: rgba(20, 28, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #ff6b35;
            padding-left: 15px;
            color: #fff;
        }
        .channel-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .channel-btn {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1722 100%);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 20px;
            border-radius: 50px;
            color: #eef2ff;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .channel-btn:hover, .channel-btn.active {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff6b35, #f7b42c);
            color: #000;
            border-color: transparent;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(247,180,44,0.3);
        }
        .info-text {
            text-align: center;
            color: #6c7a8e;
            font-size: 0.85rem;
            margin-top: 20px;
            line-height: 1.6;
        }
        .footer { text-align: center; color: #5a6a85; font-size: 0.75rem; margin-top: 25px; }
    </style>
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Sibli Mal Tv</h1>
        <p>🎬 একটি চ্যানেল সিলেক্ট করুন</p>
    </div>

    <div class="player-wrapper">
        <video id="livePlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">আপনার ব্রাউজারটি এটি সাপোর্ট করছে না।</p>
        </video>
    </div>

    <div class="channels-section">
        <div class="section-title">
            📺 লাইভ চ্যানেল সমূহ (M3U প্লেলিস্ট)
        </div>
        <div class="channel-grid" id="m3uChannels">
            </div>
    </div>

    <div class="info-text">
        🔊 ভিডিও চালু হওয়ার পর আওয়াজ না আসলে প্লেয়ারের স্পিকার আইকন থেকে <b>Unmute</b> করে নিন।<br>
        🔄 কোনো চ্যানেল বাফারিং করলে বা "Media could not be loaded" দেখালে অন্য বাটন ট্রাই করুন।
    </div>
    
    <div class="footer">
        Sibli Mal Tv © 2026
    </div>
</div>

<script>
    (function() {
        // লোকাল ফাইলে জাতে ইন্টারফেস না হারায়, তাই ডিরেক্ট লিংক সেট করে দেওয়া হলো
        const staticChannels = [
            { name: "সময় টিভি (সরাসরি)", url: "https://stream.somoynews.tv/somoytv/somoytv.smil/playlist.m3u8" },
            { name: "যমুনা টিভি", url: "https://jamuna.m3u8.live/hls/stream.m3u8" },
            { name: "ডিবিসি নিউজ", url: "https://dbc.m3u8.live/live/stream.m3u8" },
            { name: "একাত্তর টিভি", url: "https://ekattor.m3u8.live/hls/ekattor.m3u8" },
            { name: "টি স্পোর্টস ফিড", url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8" },
            { name: "লাইভ স্পোর্টস ২", url: "https://bitdash-a.akamaihd.net/content/MI201109210084_1/m3u8s/f08e80da-bf1d-4e3d-8899-f0f6155f6efa.m3u8" },
            { name: "ফিফা স্ট্রিম (Alt)", url: "https://demo.unified-streaming.com/kaltura/smil:tears-of-steel.smil/playlist.m3u8" }
        ];
        
        let player = null;

        function initPlayer() {
            if (player) return;
            player = videojs('livePlayer', {
                liveui: true,
                autoplay: 'muted', 
                controls: true,
                fluid: true,
                html5: { vhs: { overrideNative: true } }
            });
        }

        function loadChannel(url, channelName) {
            if (!player) initPlayer();
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.load();
            player.play().catch(e => console.log("Autoplay handle"));
            document.querySelector('.header p').innerHTML = `🎬 বর্তমানে চলছে: <b>${channelName}</b>`;
        }

        function renderButtons() {
            const container = document.getElementById('m3uChannels');
            container.innerHTML = ''; // রিফ্রেশ

            staticChannels.forEach((ch, index) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerText = ch.name;
                btn.onclick = () => {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadChannel(ch.url, ch.name);
                };
                container.appendChild(btn);
                
                // প্রথম বাটনটি অটোমেটিক অ্যাক্টিভ করার জন্য
                if(index === 0) {
                    btn.classList.add('active');
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPlayer();
            renderButtons();
            
            // প্রথম চ্যানেলটি অটোমেটিক প্লে করার চেষ্টা
            setTimeout(() => {
                if(staticChannels.length > 0) {
                    loadChannel(staticChannels[0].url, staticChannels[0].name);
                }
            }, 500);
        });
    })();
</script>
</body>
</html>
