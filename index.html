<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shohag TV Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --primary-glow: #00f0ff;
            --accent-neon: #ff0055;
            --bg-glass: rgba(18, 20, 29, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #060709 0%, #0e1118 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Fixed Premium Player Deck */
        .player-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #000;
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.15);
            border-bottom: 2px solid var(--primary-glow);
        }
        video {
            width: 100%;
            max-height: 230px;
            aspect-ratio: 16/9;
            display: block;
            background: #000;
        }

        /* Neon Header styling */
        .brand-bar {
            background: rgba(10, 12, 18, 0.95);
            padding: 15px 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        .brand-logo {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .brand-logo span {
            color: var(--primary-glow);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }
        .live-counter {
            background: rgba(255, 0, 85, 0.12);
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        /* Premium Netflix style Category Slider */
        .category-hub {
            background: #090b11;
            padding: 14px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .slider-deck {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 20px;
            gap: 12px;
        }
        .slider-deck::-webkit-scrollbar { display: none; }
        
        .hub-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #949aab;
            border: 1px solid var(--card-border);
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hub-btn.active, .hub-btn:hover {
            background: linear-gradient(90deg, var(--primary-glow), #0072ff);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Glassmorphism Channel Grid */
        .grid-container {
            padding: 20px;
        }
        .channel-card-premium {
            background: var(--bg-glass);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
        }
        .channel-card-premium:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary-glow);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.1);
            transform: scale(1.02);
        }
        .avatar-frame {
            width: 55px; height: 55px;
            border-radius: 14px;
            background: linear-gradient(45deg, #161923, #252b3d);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            margin-right: 18px; overflow: hidden; flex-shrink: 0;
        }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-frame { flex-grow: 1; }
        .info-frame h6 { margin: 0; font-size: 1rem; font-weight: 600; color: #fff; }
        .info-frame p { margin: 4px 0 0 0; font-size: 0.75rem; color: #6c757d; }
        
        .play-indicator { color: #6c757d; font-size: 1.3rem; transition: color 0.2s; }
        .channel-card-premium:hover .play-indicator { color: var(--primary-glow); }

        /* Loader Animation */
        .neon-loader {
            text-align: center; padding: 50px 20px; color: #6c757d; font-size: 1.1rem;
        }
        .neon-loader i { color: var(--primary-glow); font-size: 2rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoDeck" controls autoplay playsinline></video>
    </div>

    <div class="brand-bar">
        <div class="brand-logo"><span>Shohag</span> TV Pro</div>
        <div class="live-counter"><i class="fa-solid fa-satellite-dish"></i> 200+ AUTOMATIC CHANNELS</div>
    </div>

    <div class="category-hub">
        <div class="slider-deck">
            <button class="hub-btn active" onclick="filterGroup('All')">⚡ All Streams</button>
            <button class="hub-btn" onclick="filterGroup('Sports')">⚽ Sports & WC</button>
            <button class="hub-btn" onclick="filterGroup('Bangla')">🇧🇩 Bangladesh</button>
            <button class="hub-btn" onclick="filterGroup('Indian')">🇮🇳 Star & Sony</button>
            <button class="hub-btn" onclick="filterGroup('Kids')">👶 Kids Cartoon</button>
            <button class="hub-btn" onclick="filterGroup('Adult')">🔞 Adult 18+</button>
        </div>
    </div>

    <div id="neonLoader" class="neon-loader">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        Bypassing Server Restrictions... Fetching 200+ Live Channels...
    </div>
    <div class="grid-container" id="gridDeck"></div>

    <script>
        // কর্স ব্লকিং বাইপাস করার জন্য ৩টি হাই-স্পিড গ্লোবাল ওপেন-সোর্স প্রক্সি ইঞ্জিন
        const corsProxies = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://thingproxy.freeboard.io/fetch/"
        ];
        
        // ২০০+ মেগা সচল চ্যানেল সোর্স রিপোজিটরি 
        const targetPlaylist = "https://raw.githubusercontent.com/Romaxa55/world_ip_tv/main/world_ip_tv.m3u";

        let channelDatabase = [];
        const videoElement = document.getElementById('videoDeck');
        const gridDeck = document.getElementById('gridDeck');
        const neonLoader = document.getElementById('neonLoader');
        let hlsEngineInstance = null;

        // আল্ট্রা বাইপাস প্লেলিস্ট ডাউনলোডার এবং ক্যাটাগরি পার্সার
        async function launchPremiumEngine() {
            // প্রক্সি যোগ করে রিকোয়েস্ট পাঠানো হচ্ছে যেন ব্রাউজার ব্লক করতে না পারে
            const securedUrl = corsProxies[0] + encodeURIComponent(targetPlaylist);
            
            try {
                const res = await fetch(securedUrl);
                if (!res.ok) throw new Error();
                const rawData = await res.text();
                parseM3UStream(rawData);
            } catch (err) {
                // ১ম প্রক্সি ফেইল করলে ২য় ব্যাকআপ প্রক্সি দিয়ে ট্রাই করা হবে
                try {
                    const backupUrl = corsProxies[1] + targetPlaylist;
                    const resBackup = await fetch(backupUrl);
                    const rawDataBackup = await resBackup.text();
                    parseM3UStream(rawDataBackup);
                } catch(e) {
                    neonLoader.innerHTML = "<i class='fa-solid fa-triangle-exclamation text-danger'></i> Network congestion! Please reload this page in Incognito Tab.";
                }
            }
        }

        // M3U থেকে আপনার নির্দিষ্ট পজিশন ও রুলস অনুযায়ী ফিল্টারিং ম্যাজিক
        function parseM3UStream(data) {
            const lines = data.split('\n');
            let tempChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    tempChannel = {};
                    
                    // চ্যানেল নেম এক্সট্রাকশন
                    const titleParts = line.match(/,(.+)$/);
                    tempChannel.name = titleParts ? titleParts[1].trim() : "Live Channel Feed";
                    
                    // লগো ইউআরএল এক্সট্রাক্ট
                    const logoParts = line.match(/tvg-logo="([^"]+)"/);
                    tempChannel.logo = logoParts ? logoParts[1] : "https://images.unsplash.com/photo-1540747737956-37872a7e86e5?q=80&w=100";
                    
                    let normName = tempChannel.name.toLowerCase();
                    
                    // আপনার স্পেসিফিক রিকোয়ারমেন্ট ম্যাপিং পজিশন
                    if (normName.includes('sport') || normName.includes('cricket') || normName.includes('football') || normName.includes('willow') || normName.includes('sony ten') || normName.includes('star sports') || normName.includes('bein') || normName.includes('ptv') || normName.includes('gtv') || normName.includes('t sports')) {
                        tempChannel.category = "Sports";
                        if(normName.includes('foot') || normName.includes('sport')) {
                            tempChannel.name = "🏆 World Cup - " + tempChannel.name;
                        }
                    } else if (normName.includes('bangla') || normName.includes('somoy') || normName.includes('jamuna') || normName.includes('channel 24') || normName.includes('ekattor') || normName.includes('btv') || normName.includes('independent')) {
                        tempChannel.category = "Bangla";
                    } else if (normName.includes('star') || normName.includes('zee') || normName.includes('sony') || normName.includes('colors') || normName.includes('tata')) {
                        tempChannel.category = "Indian";
                    } else if (normName.includes('cartoon') || normName.includes('disney') || normName.includes('nick') || normName.includes('pogo') || normName.includes('kids')) {
                        tempChannel.category = "Kids";
                    } else if (normName.includes('xxx') || normName.includes('adult') || normName.includes('18+') || normName.includes('playboy') || normName.includes('hustler')) {
                        tempChannel.category = "Adult";
                    } else {
                        tempChannel.category = "Sports"; // আপনার প্রধান চাহিদাকে ডিফল্ট রাখা হলো
                    }
                } else if (line.startsWith('http')) {
                    tempChannel.url = line;
                    if (tempChannel.url.startsWith('https://')) {
                        channelDatabase.push(tempChannel);
                    }
                }
            }

            neonLoader.style.display = 'none';
            renderGrid('All');
            
            // অটো প্লে প্রথম সচল চ্যানেল
            if(channelDatabase.length > 0) {
                streamLauncher(channelDatabase[0].url);
            }
        }

        // প্রিমিয়াম UI গ্রিড মেকার (সর্বোচ্চ ২৫০টি চ্যানেল লোড হবে)
        function renderGrid(filterGroup) {
            if (!gridDeck) return;
            gridDeck.innerHTML = "";
            
            let loadCount = 0;
            channelDatabase.forEach((chan) => {
                if (loadCount < 250 && (filterGroup === 'All' || chan.category === filterGroup)) {
                    const card = document.createElement('div');
                    card.className = 'channel-card-premium';
                    card.setAttribute('onclick', `streamLauncher("${chan.url}")`);

                    card.innerHTML = `
                        <div class="avatar-frame">
                            <img src="${chan.logo}" alt="Ch Logo" onerror="this.src='https://images.unsplash.com/photo-1540747737956-37872a7e86e5?q=80&w=100'">
                        </div>
                        <div class="info-frame">
                            <h6>${chan.name}</h6>
                            <p>${chan.category} • Live Premium Stream</p>
                        </div>
                        <div class="play-indicator">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    `;
                    gridDeck.appendChild(card);
                    loadCount++;
                }
            });
        }

        // ক্যাটাগরি ফিল্টার অ্যাকশন
        function filterGroup(groupName) {
            const targetButtons = document.querySelectorAll('.hub-btn');
            targetButtons.forEach(b => b.classList.remove('active'));
            
            if (window.event && window.event.target) {
                window.event.target.classList.add('active');
            } else if (event && event.target) {
                event.target.classList.add('active');
            }
            renderGrid(groupName);
        }

        // হাই-স্পিড নো-বাফারিং প্লেয়ার কোর ইঞ্জিন (CORS Proxy Assisted)
        function streamLauncher(streamUrl) {
            if (hlsEngineInstance) {
                hlsEngineInstance.destroy();
            }

            // প্লে করার সময়ও প্রক্সি টানেল ব্যবহার করা হচ্ছে যাতে ভিডিও লোড আটকে না যায়
            let dynamicStreamUrl = streamUrl;
            if(!streamUrl.includes('secure.footprint.net')) {
                dynamicStreamUrl = corsProxies[1] + streamUrl; 
            }

            if (Hls.isSupported()) {
                hlsEngineInstance = new Hls({
                    maxBufferLength: 15,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 60
                });
                hlsEngineInstance.loadSource(dynamicStreamUrl);
                hlsEngineInstance.attachMedia(videoElement);
                hlsEngineInstance.on(Hls.Events.MANIFEST_PARSED, function() { 
                    videoElement.play().catch(e => console.log("Autoplay Handled")); 
                });
                
                hlsEngineInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        hlsEngineInstance.startLoad();
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = dynamicStreamUrl;
                videoElement.addEventListener('loadedmetadata', () => videoElement.play());
            }
        }

        window.onload = function() {
            launchPremiumEngine();
        };
    </script>
</body>
</html>
