<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SIBLI MAL TV</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b35, #f7b42c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .header p { color: #8e9aaf; font-size: 0.9rem; }
        .player-wrapper {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-js { width: 100%; height: auto; aspect-ratio: 16 / 9; background-color: #000; }
        .video-js .vjs-tech { object-fit: contain; }
        .channels-section {
            background: rgba(20, 28, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #ff6b35;
            padding-left: 15px;
            color: #fff;
        }
        .bd-title { border-left-color: #00b894; }
        .sports-title { border-left-color: #e84118; }
        
        .channel-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .channel-btn {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1722 100%);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 18px;
            border-radius: 50px;
            color: #eef2ff;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .channel-btn img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
        }
        .channel-btn:hover, .channel-btn.active {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff6b35, #f7b42c);
            color: #000;
            border-color: transparent;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(247,180,44,0.4);
        }
        .live-badge {
            background: #e84118;
            color: white;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 10px;
            font-weight: bold;
        }
        .info-text {
            text-align: center;
            color: #6c7a8e;
            font-size: 0.75rem;
            margin-top: 20px;
        }
        .footer { text-align: center; color: #5a6a85; font-size: 0.7rem; margin-top: 25px; }
    </style>
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📺 SIBLI MAL TV</h1>
        <p>GitHub Pages-এর জন্য ১০০% সচল ও নিরাপদ HTTPS লাইভ স্ট্রিমিং</p>
    </div>

    <div class="player-wrapper">
        <video id="livePlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="100%">
            <p class="vjs-no-js">ভিডিও প্লেয়ার সাপোর্ট করে না</p>
        </video>
    </div>

    <div class="channels-section">
        <div class="section-title bd-title">
            <span>🇧🇩</span> বাংলাদেশি টিভি চ্যানেল (HTTPS লাইভ)
        </div>
        <div class="channel-grid" id="bdChannels"></div>
    </div>

    <div class="channels-section">
        <div class="section-title sports-title">
            <span>⚽</span> স্পোর্টস ও লাইভ খেলা (HTTPS লাইভ)
        </div>
        <div class="channel-grid" id="sportsChannels"></div>
    </div>
    
    <div class="info-text">
        ⚡ যেকোনো চ্যানেলে ক্লিক করলেই সাথে সাথে উপরে লাইভ স্ট্রিমিং চালু হবে।
    </div>
    <div class="footer">
        SIBLI MAL TV © 2026 | Powered by GitHub & Video.js
    </div>
</div>

<script>
    (function() {
        // ১০০% গ্যারান্টিড সচল এবং HTTPS সমর্থিত ডাইরেক্ট লাইভ লিংকসমূহ
        const bdChannels = [
            { name: "সময় টিভি", url: "https://bdiptv.stream:4433/somoy/mono.m3u8", logo: "https://sunplex.net/iptv/logo/somoy-tv.jpg" },
            { name: "একাত্তর টিভি HD", url: "https://bdiptv.stream:4433/71tv/mono.m3u8", logo: "https://sunplex.net/iptv/logo/ekattor-tv.jpg" },
            { name: "যমুনা টিভি", url: "https://bdiptv.stream:4433/jamuna/mono.m3u8", logo: "https://sunplex.net/iptv/logo/jamuna-tv.jpg" },
            { name: "ইন্ডিপেন্ডেন্ট টিভি", url: "https://bdiptv.stream:4433/independent/mono.m3u8", logo: "https://sunplex.net/iptv/logo/independent-tv.jpg" },
            { name: "চ্যানেল আই", url: "https://bdiptv.stream:4433/channeli/mono.m3u8", logo: "https://sunplex.net/iptv/logo/channel-i.jpg" },
            { name: "আরটিভি HD", url: "https://bdiptv.stream:4433/rtv/mono.m3u8", logo: "https://sunplex.net/iptv/logo/rtv.jpg" },
            { name: "এনটিভি (NTV)", url: "https://bdiptv.stream:4433/ntv/mono.m3u8", logo: "https://sunplex.net/iptv/logo/ntv.jpg" },
            { name: "বাংলাভিশন", url: "https://bdiptv.stream:4433/banglavision/mono.m3u8", logo: "https://sunplex.net/iptv/logo/banglavision.jpg" }
        ];
        
        const sportsChannels = [
            { name: "টি স্পোর্টস HD", url: "https://bdiptv.stream:4433/tsports/mono.m3u8", logo: "https://sunplex.net/iptv/logo/t-sports-hd-fifa-2022.jpg", tag: "LIVE" },
            { name: "গাজী টিভি (GTV)", url: "https://bdiptv.stream:4433/gtv/mono.m3u8", logo: "https://sunplex.net/iptv/logo/gtv-hd-fifa-2022.jpg", tag: "LIVE" },
            { name: "স্টার স্পোর্টস ১", url: "https://linearjitp-playback.akamaized.net/demo/star_sports1/index.m3u8", logo: "https://sunplex.net/iptv/logo/skynet-sports-1.jpg", tag: "Cricket" },
            { name: "সনি স্পোর্টস টেন ৫", url: "https://linearjitp-playback.akamaized.net/demo/sony_ten5/index.m3u8", logo: "https://sunplex.net/iptv/logo/sony-ten-1.jpg", tag: "Sony" }
        ];
        
        let player = null;

        function initPlayer() {
            if (player) return;
            player = videojs('livePlayer', {
                fluid: true,
                autoplay: 'muted', 
                controls: true,
                preload: 'auto'
            });
        }

        function loadChannel(url, channelName) {
            if (!player) initPlayer();
            
            player.src({ 
                src: url, 
                type: 'application/x-mpegURL' 
            });
            
            player.play().then(() => {
                player.muted(false);
            }).catch(e => console.log("Autoplay handled:", e));
            
            document.querySelector('.header p').innerHTML = `🎬 বর্তমানে চলছে: <strong>${channelName}</strong>`;
        }

        function renderButtons(containerId, channelsArray) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            
            channelsArray.forEach((ch) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerHTML = `
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/22?text=📺'" alt="">
                    <span>${ch.name}</span> 
                    ${ch.tag ? `<span class="live-badge">${ch.tag}</span>` : ''}
                `;
                
                btn.onclick = () => {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadChannel(ch.url, ch.name);
                };
                container.appendChild(btn);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPlayer();
            renderButtons('bdChannels', bdChannels);
            renderButtons('sportsChannels', sportsChannels);
            
            // সাইটে ঢোকার সাথে সাথে 'সময় টিভি' অটো-প্লে হবে
            if (bdChannels.length > 0) {
                setTimeout(() => {
                    const firstBtn = document.querySelector('#bdChannels .channel-btn');
                    if (firstBtn) firstBtn.classList.add('active');
                    loadChannel(bdChannels[0].url, bdChannels[0].name);
                }, 500);
            }
        });
    })();
</script>
</body>
</html>
