<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibli Mal Tv</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .container {
            display: flex;
            flex-direction: row;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .player-section {
            flex: 2.5;
        }
        .playlist-section {
            flex: 1;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .playlist-section h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            font-size: 18px;
        }
        .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .channel-item {
            padding: 14px;
            background: #1e293b;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            border-left: 4px solid transparent;
        }
        .channel-item:hover {
            background: #38bdf8;
            color: #000;
            transform: translateX(5px);
        }
        .active-channel {
            background: #38bdf8;
            color: #000;
            border-left: 4px solid #0284c7;
            font-weight: bold;
        }
        /* Responsive Layout */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .playlist-section {
                max-height: 280px;
            }
        }
    </style>
</head>
<body>

    <h1>Sibli Mal Tv</h1>
    <div class="subtitle">Live Sports & Entertainment Streaming</div>

    <div class="container">
        <div class="player-section">
            <video
                id="my-video"
                class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9"
                controls
                preload="auto"
                width="100%"
                data-setup='{}'>
                <p class="vjs-no-js">
                    To view this video please enable JavaScript, and consider upgrading to a
                    web browser that supports HTML5 video
                </p>
            </video>
        </div>

        <div class="playlist-section">
            <h3>Sports Channels</h3>
            <ul id="channel-list" class="channel-list">
                <li class="channel-item">Loading Live Channels...</li>
            </ul>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        const player = videojs('my-video');
        const channelListContainer = document.getElementById('channel-list');

        // আপনার একই গিটহাব রিপোজিটরিতে থাকা প্লেলিস্ট ফাইলের নাম
        const m3uUrl = 'playlist.m3u'; 

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    if (nameMatch) {
                        currentChannel.name = nameMatch[1];
                    }
                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {}; 
                }
            }
            return channels;
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error('Could not load playlist.m3u');
                const data = await response.text();
                const channels = parseM3U(data);

                if (channels.length === 0) {
                    channelListContainer.innerHTML = '<li class="channel-item">No channels available.</li>';
                    return;
                }

                channelListContainer.innerHTML = ''; 

                channels.forEach((channel, index) => {
                    const li = document.createElement('li');
                    li.className = 'channel-item';
                    li.textContent = channel.name || `Sports Ch ${index + 1}`;
                    
                    li.addEventListener('click', () => {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active-channel'));
                        li.classList.add('active-channel');

                        player.src({
                            src: channel.url,
                            type: 'application/x-mpegURL'
                        });
                        player.play().catch(error => {
                            console.log("Playback failed or interrupted:", error);
                        });
                    });

                    channelListContainer.appendChild(li);

                    // প্রথম চ্যানেলটি পেজ লোড হওয়ার সাথে সাথে সেট হবে
                    if (index === 0) {
                        li.classList.add('active-channel');
                        player.src({
                            src: channel.url,
                            type: 'application/x-mpegURL'
                        });
                    }
                });

            } catch (error) {
                console.error('Error:', error);
                channelListContainer.innerHTML = '<li class="channel-item" style="color: #ef4444;">Failed to load channels. Please check playlist.m3u file!</li>';
            }
        }

        window.onload = loadPlaylist;
    </script>
</body>
</html>
